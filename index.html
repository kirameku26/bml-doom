
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>BML Development</title>
  <style>
    body {
      font-family: sans-serif;
      background: #202020;
      color: white;
    }
    
#tv-frame {
  position: relative;
  width: 100%;
  max-width: 960px;
  aspect-ratio: 16 / 9;
  background: black;
  overflow: hidden;
  border: 2px solid #555;
  border-radius: 8px;
  box-sizing: border-box;
}

#screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 960px;
  height: 540px;
  transform-origin: top left;
}

    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>BML Developer</h2>


<div id="tv-frame">
  <div id="screen"></div>
</div>

<div id="media" hidden></div>


  <p>
    <button data-key="ArrowUp">↑</button>
    <button data-key="ArrowDown">↓</button>
    <button data-key="ArrowLeft">←</button>
    <button data-key="ArrowRight">→</button>
    <button data-key="Enter">決定</button>
  </p>

  <p>
    <button data-key="b">青</button>
    <button data-key="r">赤</button>
    <button data-key="g">緑</button>
    <button data-key="y">黄</button>
    <button data-key="d">dボタン</button>
  </p>

  <button onclick="location.reload()">再読み込み</button>

  <script type="module" src="/main.js"></script>
</body>
</html>
